name: Codex review gate

on:
  workflow_run:
    workflows: [Codex review trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  wait-for-codex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: codex-review-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true

    steps:
      - name: Check out trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for Codex review of the pull request head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node scripts/codex-review-gate.mjs
