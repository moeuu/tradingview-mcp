name: Codex review gate

on:
  pull_request_target:
    branches: [main]
    types: [edited, opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  wait-for-codex:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: codex-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Wait for Codex review of the pull request head
        env:
          FORCE_CODEX_VERIFICATION: ${{ github.event.action == 'edited' }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_EVENT_AT: ${{ github.event.pull_request.updated_at }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/codex-review-gate.mjs
